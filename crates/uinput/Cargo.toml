[package]
name = "vrover-uinput"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VRover InputSink backend: Linux uinput kernel virtual device"

[features]
default = []
# Build the real evdev/uinput backend. Off by default so the workspace builds
# without pulling evdev; the keycode mapping module always compiles + tests.
backend = ["dep:evdev"]

[dependencies]
vrover-drivers.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.12", optional = true }
