[package]
name = "vrover-libei"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VRover InputSink backend: libei / xdg-desktop-portal emulated input"

[features]
default = []
# Build the real libei backend. Off by default: libei is not packaged in this
# container and the Rust bindings are niche; the crate ships a documented NotBuilt
# stub until the real path lands.
libei = []

[dependencies]
vrover-drivers.workspace = true
